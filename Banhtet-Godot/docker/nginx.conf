server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control no-store always;
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    # Proxy API cùng origin -> cookie phiên quản trị hoạt động trên trình duyệt
    location /api/ {
        proxy_pass https://banh-tet-viet.vercel.app/api/;
        proxy_set_header Host banh-tet-viet.vercel.app;
        proxy_ssl_server_name on;
        proxy_cookie_flags ~ nosecure;
        proxy_cookie_domain banh-tet-viet.vercel.app $host;
    }
}
